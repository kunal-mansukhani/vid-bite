version: '3.8'

services:
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - API_KEY=${API_KEY}
    volumes:
      - ./backend:/home/appuser/app
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  backend: